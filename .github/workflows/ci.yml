name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Generate build inputs once
        run: |
          npm run data:build
          npm run details:build
      - name: Generated data is committed and reproducible
        run: git diff --exit-code -- data/quality-baseline.json public/data reports
      - run: npx next build
      - run: npm test
      - name: Build the public release
        id: build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3001
        run: |
          npm run build:release -- --preview 2>&1 | tee "$RUNNER_TEMP/namae-release-build.log"
          release_dir=$(sed -n 's/^Static release: //p' "$RUNNER_TEMP/namae-release-build.log")
          test -f "$release_dir/data/manifest.json"
          printf 'directory=%s\n' "$release_dir" >> "$GITHUB_OUTPUT"
      - name: Verify public release source metadata
        env:
          NAMAE_STATIC_DIR: ${{ steps.build.outputs.directory }}
        run: npm run licenses:check -- "$NAMAE_STATIC_DIR"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify the public release through HTTP and the browser
        env:
          NAMAE_STATIC_DIR: ${{ steps.build.outputs.directory }}
          NAMAE_PREVIEW_URL: http://127.0.0.1:3001
          PORT: '3001'
        run: |
          node scripts/serve.mjs > "$RUNNER_TEMP/namae-release-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            --max-time 3 --output /dev/null "$NAMAE_PREVIEW_URL/"
          node scripts/check-deployment.mjs "$NAMAE_PREVIEW_URL" --all
          npx playwright test tests/release.browser.spec.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-release-verification
          include-hidden-files: true
          path: |
            reports/
            .tmp/release-*/quality-audit.json
            .tmp/release-*/out/data/coverage.json
            reports/release-name-review.json
            ${{ runner.temp }}/namae-release-build.log
            ${{ runner.temp }}/namae-release-server.log
            test-results/
          if-no-files-found: ignore
