name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Generated data is committed and reproducible
        run: git diff --exit-code -- data public/data reports
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Start static site
        run: npm start > /tmp/namae-server.log 2>&1 &
      - name: Wait for static site
        run: for i in {1..30}; do curl --fail --silent http://localhost:3000/ >/dev/null && exit 0; sleep 1; done; cat /tmp/namae-server.log; exit 1
      - run: npm run test:browser
      - name: Enforce source redistribution review on production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run licenses:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-quality-and-browser-results
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
